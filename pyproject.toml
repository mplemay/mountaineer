[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mountaineer"
version = "0.1.0"
description = "Mountaineer is a batteries-included webapp framework for Python."
readme = "README.md"
authors = [
    { name = "Pierce Freeman", email = "pierce@freeman.vc" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.5.3,<3.0.0",
    "fastapi>=0.114.1,<1.0.0",
    "inflection>=0.5.1,<1.0.0",
    "click>=8.1.7,<9.0.0",
    "uvicorn[standard]>=0.40,<1.0.0",
    "packaging>=23.2",
    "pydantic-settings>=2.1.0,<3.0.0",
    # These are technically optional dependencies, since release configurations will not need these, but we
    # include them by default since we don't want to force regular dev builds to install an extras
    # for basic CLI functionality.
    "rich>=13.7.1,<14.0.0",
    "watchfiles>=1.0.0,<2.0.0",
    "firehot>=0.4.0,<1.0.0",
]
exclude = [
    "fixtures",
    "media",
    "docs_website",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstrument>=5.0.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "python-multipart>=0.0.20",
    "ruff>=0.10.0",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
    "maturin>=1.0,<2.0",
    "pre-commit>=4.5.1",
    "rumdl>=0.1.0",
    "ty>=0.0.14",
]

[tool.uv]
# NOTE: https://github.com/PyO3/maturin/issues/2314
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[tool.maturin]
module-name = "mountaineer._core"
python-packages = ["mountaineer"]
python-source = "src"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "src/mountaineer/*.py",
    "src/mountaineer/*.pyi",
    "src/mountaineer/__*",
    "src/mountaineer/[!_v]*",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", # pydocstyle (i.e. ignore missing/malformed docstrings)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # imported but unused (common in __init__.py to re-export symbols)
]
"**/__tests__/**/*" = [
    "ANN001",  # missing type annotation for function argument
    "ANN002",  # missing type annotation for *args
    "ANN003",  # missing type annotation for **kwargs
    "ANN201",  # missing return type annotation for public function
    "ANN202",  # missing return type annotation for private function
    "ANN204",  # missing return type annotation for special method
    "ARG001",  # unused function argument
    "ARG005",  # unused lambda argument
    "B008",    # function call in argument defaults (required for FastAPI Depends)
    "EM101",   # exception must not use string literal
    "F841",    # local variable assigned but never used
    "FAST002", # FastAPI dependency without Annotated
    "INP001",  # implicit namespace package (tests dir may not need __init__.py)
    "PLC0415", # import should be at top-level
    "PLR0913", # too many arguments in function definition
    "PLR2004", # magic value used in comparison (fine in test cases)
    "PT012",   # pytest.raises should contain single statement
    "S101",    # use of assert (tests typically use assert directly)
    "S106",    # possible hardcoded password (test secrets are fine)
    "SLF001",  # private member accessed
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.rumdl.MD013]
line_length = 120
reflow = true
reflow-mode = "sentence-per-line"
code-blocks = false
tables = false

[tool.ty]
exclude = [
    "src/mountaineer/*.py",
    "src/mountaineer/*.pyi",
    "src/mountaineer/__*",
    "src/mountaineer/[!_v]*",
]

[tool.pytest.ini_options]
markers = ["integration_tests: run longer-running integration tests"]
# Default pytest runs shouldn't execute the integration tests
addopts = "-m 'not integration_tests'"
