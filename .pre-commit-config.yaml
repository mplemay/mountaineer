repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: python
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        args: []
        pass_filenames: false
        additional_dependencies: []
      - id: rumdl-fmt
        name: rumdl fmt
        entry: uv run rumdl fmt
        language: python
        types: [markdown]
        require_serial: true
      - id: rumdl-check
        name: rumdl check
        entry: uv run rumdl check
        language: python
        types: [markdown]
        require_serial: true
